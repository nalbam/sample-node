apiVersion: agent.opspresso.com/v4
kind: Application
spec:
  name: "sample-node"
  repository: "github.com/nalbam/sample-node"
  owner: "dBT43yQ7DQIIIMlYbjiXsIr8tbuIgVJA"
runtime:
  port: 3000
  health: "/health"
secrets:
  - FAULT_RATE
env:
  LOG_LEVEL: "info"
  REDIS_TIMEOUT_MS: "1000"
  SHUTDOWN_TIMEOUT_MS: "10000"
test:
  image: "node:26"
  command: "npm ci && npm test"
