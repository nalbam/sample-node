name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - name: Build Docker image
        run: docker build -t sample-node:ci .
      - name: Check container responds on port 3000
        run: |
          docker run -d --name sample-node-ci -e REDIS_ENABLED=false -p 3000:3000 sample-node:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs sample-node-ci
          exit 1
